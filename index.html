<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fundTogether</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===================== NAVBAR ===================== -->

    <nav class="navbar navbar-expand-lg py-3 px-lg-5 px-3">
      <div class="container-fluid">
        <!-- LEFT -->
        <div class="d-flex align-items-center gap-3 order-lg-1 order-2">
          <button class="btn brutal-btn">
            <i class="bi bi-search"></i>
          </button>

          <div class="dropdown hover-dropdown">
            <button
              class="btn brutal-btn dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              Donate
            </button>

            <ul class="dropdown-menu p-3 brutal-dropdown">
              <li class="dropdown-header fs-6 fw-bold text-dark">Categories</li>

              <li><a class="dropdown-item" href="#">Medical</a></li>
              <li><a class="dropdown-item" href="#">Education</a></li>
              <li><a class="dropdown-item" href="#">Loan</a></li>
              <li><a class="dropdown-item" href="#">Stories</a></li>
            </ul>
          </div>
        </div>

        <!-- CENTER -->
        <a
          class="navbar-brand mx-auto fw-bold fs-2 text-uppercase logo order-lg-2 order-1"
          href="#"
        >
          fundTogether
        </a>

        <!-- RIGHT -->
        <div class="d-flex align-items-center gap-3 order-lg-3 order-3">
          <!-- Theme -->
          <button class="btn brutal-btn theme-toggle" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
          </button>

          <!-- About -->

          <div class="dropdown hover-dropdown">
            <button
              class="btn brutal-btn dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              About
            </button>

            <ul class="dropdown-menu p-3 brutal-dropdown">
              <li><a class="dropdown-item" href="#">Problem & Solution</a></li>
              <li><a class="dropdown-item" href="#">How to Donate</a></li>
              <li><a class="dropdown-item" href="#">Inspiration</a></li>
              <li><a class="dropdown-item" href="#">Help Centre</a></li>
            </ul>
          </div>

          <!-- Sign In -->

          <button
            class="btn brutal-btn"
            data-bs-toggle="modal"
            data-bs-target="#signinModal"
          >
            Sign In
          </button>
        </div>
      </div>
    </nav>

    <!-- ===================== HERO ===================== -->

    <section class="hero container">
      <div class="row justify-content-center">
        <div class="col-xl-10 text-center">
          <h1 class="hero-title">
            Donate with Proof
            <br />
            Not Promises
          </h1>

          <button class="btn hero-btn mt-5">Start a Campaign</button>
        </div>
      </div>
    </section>

    <!-- ===================== SIGN IN MODAL ===================== -->

    <div class="modal fade" id="signinModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content brutal-modal">
          <div class="modal-header">
            <h4 class="modal-title fw-bold">Sign In</h4>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label class="form-label"> First Name </label>

                <input type="text" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Last Name </label>

                <input type="text" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Email </label>

                <input type="email" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label"> Password </label>

                <input type="password" class="form-control" />
              </div>

              <div class="mb-4">
                <label class="form-label"> Confirm Password </label>

                <input type="password" class="form-control" />
              </div>

              <div class="d-flex justify-content-end gap-3">
                <button type="reset" class="btn brutal-btn">Reset</button>

                <button type="submit" class="btn hero-btn">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
  </body>
</html>
